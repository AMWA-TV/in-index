name: Mint IN-XXX repo

on:
  push:
    branches: [main]
    paths:
      - 'proposals/*.yml'
      - 'proposals/*.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Preview minting without creating repos, setting secrets, or
          modifying index.yml. Shows allocated numbers and a full
          customisation diff against in-template.
        type: boolean
        default: true

# Serialise mint runs so we never race on number allocation.
concurrency:
  group: mint-in-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mint:
    runs-on: ubuntu-latest
    # On push, skip our own follow-up commit to avoid a self-triggered no-op
    # run. head_commit only exists for push events, so guard on event_name.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: record newly-minted') }}"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MINTER_APP_ID }}
          private-key: ${{ secrets.MINTER_APP_PRIVATE_KEY }}
          owner: AMWA-TV

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Mint any new proposals
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: ./.github/scripts/mint-in-repo.sh

      - name: Regenerate README index table
        if: ${{ !inputs.dry_run }}
        run: ./.github/scripts/regenerate-readme.sh

      - name: Commit index changes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git --no-pager diff --quiet && git --no-pager diff --cached --quiet; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name  'amwa-in-index-bot[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: record newly-minted IN repo(s)"
          git push
