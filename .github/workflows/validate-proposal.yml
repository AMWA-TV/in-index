name: Validate proposal

on:
  pull_request:
    # `edited` triggers on PR title/body edits so checklist ticks re-run the check.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - 'proposals/**'
      - 'schemas/**'
      - '.github/scripts/validate-proposal.sh'
      - '.github/workflows/validate-proposal.yml'
      - '.github/pull_request_template.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate proposal YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          pip install check-jsonschema pyyaml

      - name: Determine which proposal files this PR adds/modifies
        id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # List added/modified proposal YAMLs vs. the PR base.
          # Deleted files are ignored.
          mapfile -t files < <(git --no-pager diff --name-only --diff-filter=AM "${BASE_SHA}" "${HEAD_SHA}" -- 'proposals/*.yml' 'proposals/*.yaml' || true)
          printf 'Changed proposal files:\n'
          printf '  %s\n' "${files[@]}"
          {
            echo 'files<<EOF'
            printf '%s\n' "${files[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Enforce exactly one added proposal file
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          # Count non-empty entries.
          count=$(printf '%s\n' "${FILES}" | grep -c . || true)
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::No proposal file added under proposals/*.yml. Add exactly one."
            exit 1
          fi
          if [[ "${count}" -gt 1 ]]; then
            echo "::error::This PR adds/modifies ${count} proposal files. Exactly one is required per PR."
            printf '%s\n' "${FILES}"
            exit 1
          fi

      - name: Validate schema and predict next number
        id: validate
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: ./.github/scripts/validate-proposal.sh

      - name: Comment on PR with predicted number(s)
        if: steps.validate.outputs.summary != ''
        uses: actions/github-script@v8
        env:
          MINT_PREVIEW: ${{ steps.validate.outputs.summary }}
        with:
          script: |
            const summary = process.env.MINT_PREVIEW || '';
            if (!summary.trim()) return;
            const marker = '<!-- in-index:mint-preview -->';
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  pr-body:
    name: Validate PR body & checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check PR body against template
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const errors = [];

            // Extract section content for a given heading (up to the next
            // `## ` heading or end of body).
            const section = (heading) => {
              const lines = body.split(/\r?\n/);
              const start = lines.findIndex(
                (l) => l.trim().match(new RegExp(`^##\\s+${heading}\\s*$`)),
              );
              if (start === -1) return null;
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (/^##\s+\S/.test(lines[i])) {
                  end = i;
                  break;
                }
              }
              return lines.slice(start + 1, end).join("\n");
            };

            // Strip HTML comments and whitespace, and check for any of the
            // template's `_Replace this ..._` placeholder lines.
            const isEmpty = (s) => {
              if (s === null) return true;
              const stripped = s
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/^\s*[-*]\s*$/gm, "")
                .trim();
              if (stripped === "") return true;
              // Any line still matching the template placeholder pattern.
              if (/^_replace this [^_]*_\s*$/im.test(stripped)) return true;
              return false;
            };

            for (const h of ["Document title", "Slug", "Short description", "Purpose"]) {
              if (isEmpty(section(h))) {
                errors.push(`Section \`## ${h}\` is missing or still contains the template placeholder.`);
              }
            }

            // Checklist enforcement: every `- [ ]` under the checklist section must be `- [x]`.
            const checklist = section("Pre-merge checklist");
            if (checklist === null) {
              errors.push("Section `## Pre-merge checklist` is missing.");
            } else {
              const unchecked = (checklist.match(/^\s*- \[ \]/gm) || []).length;
              const checked   = (checklist.match(/^\s*- \[[xX]\]/gm) || []).length;
              if (unchecked > 0) {
                errors.push(
                  `Pre-merge checklist has ${unchecked} unticked item(s) ` +
                  `(and ${checked} ticked). All must be ticked before merge.`,
                );
              }
            }

            if (errors.length) {
              core.summary
                .addHeading("PR body checks failed")
                .addList(errors)
                .write();
              for (const e of errors) core.error(e);
              core.setFailed(`${errors.length} PR body check(s) failed.`);
            } else {
              core.info("PR body checks passed.");
            }
