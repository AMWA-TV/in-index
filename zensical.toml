[project]
site_name = "AMWA Increments"
site_description = "Index of AMWA Increments (IN) — snapshots of ongoing AMWA activity phases that may be referenced by NMOS or other specifications."
site_url = "https://specs.amwa.tv/new/in-index/"
repo_name = "AMWA-TV/in-index"
repo_url = "https://github.com/AMWA-TV/in-index"
edit_uri = "edit/main/"
docs_dir = "build/docs"
site_dir = "site"
plugins = ["search"]
nav = [{ Home = "index.md" }]
extra_css = ["stylesheets/amwa-branding.css"]
extra_javascript = ["javascripts/amwa-branding.js"]
[project.theme]
features = [
  "navigation.top",
  "content.action.edit",
  "search.suggest",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
